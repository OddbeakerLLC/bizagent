<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizAgent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="agent-rail" aria-label="Agents">
      <div class="rail-title">Agents</div>
      <div id="agents"></div>
    </aside>
    <section class="chat-shell">
      <header class="topbar">
        <div id="conversationMenu" class="conversation-menu">
          <label for="conversationSelect">Conversation</label>
          <select id="conversationSelect"></select>
          <button id="newConversation" type="button" title="New conversation" aria-label="New conversation">+</button>
          <button id="deleteConversation" type="button" class="btn-secondary" title="Delete conversation" aria-label="Delete conversation">Delete</button>
        </div>
        <div class="auth-controls">
          <button id="editDisplayName" type="button" class="btn-secondary" hidden title="Change your display name">Name</button>
          <span id="authStatus" class="auth-status">Checking session...</span>
          <button id="logout" type="button" hidden>Logout</button>
        </div>
      </header>
      <div id="authPanel" class="auth-panel" hidden>
        <p id="setupHint" class="setup-hint" hidden>First run — create a login to get started.</p>
        <input id="username" autocomplete="username" placeholder="Username">
        <input id="password" autocomplete="current-password" placeholder="Password" type="password">
        <button id="login" type="button">Login</button>
      </div>
      <div id="namePanel" class="name-panel" hidden>
        <p class="name-hint">What should we call you in chat?</p>
        <input id="displayNameInput" autocomplete="name" placeholder="Your name" maxlength="80">
        <button id="saveDisplayName" type="button">Save</button>
        <span id="nameStatus" class="auth-status" hidden></span>
      </div>

      <!-- Observability tab (Phase 0) -->
      <div id="observabilityTab" class="tab-content" hidden>
        <h2>Observability</h2>
        <div id="observabilityContent">
          <p>Loading recent events and metrics...</p>
        </div>
        <button onclick="refreshObservability()">Refresh</button>
      </div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="fixed-composer">
        <textarea id="messageInput" rows="2" placeholder="Message the hub"></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
