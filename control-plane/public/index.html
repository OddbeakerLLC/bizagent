<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizAgent</title>
  <link rel="stylesheet" href="/styles.css?v=20260904-model-picker">
</head>
<body>
  <main class="app-shell">
    <aside class="agent-rail" aria-label="Products">
      <div class="rail-title">Products</div>
      <div id="agents"></div>
    </aside>
    <section class="chat-shell" id="chatShell">
      <header class="topbar">
        <div id="conversationMenu" class="conversation-menu">
          <label for="conversationSelect">Conversation</label>
          <select id="conversationSelect"></select>
          <button id="newConversation" type="button" title="New conversation" aria-label="New conversation">+</button>
          <button id="deleteConversation" type="button" class="btn-secondary" title="Delete conversation" aria-label="Delete conversation">Delete</button>
        </div>
        <div class="auth-controls">
          <button id="libraryBtn" type="button" class="btn-secondary" hidden title="Browse plans, specs, and other docs written for you">Library</button>
          <button id="companyFilesBtn" type="button" class="btn-secondary" hidden title="Upload files to company/ for the Knowledge Stack">Company</button>
          <button id="ttsToggle" type="button" class="btn-secondary tts-toggle" hidden title="Text-to-speech for hub replies (off)" aria-pressed="false">TTS</button>
          <button id="editDisplayName" type="button" class="btn-secondary" hidden title="Change your display name">Name</button>
          <span id="authStatus" class="auth-status">Checking session...</span>
          <button id="logout" type="button" hidden>Logout</button>
        </div>
      </header>
      <div id="authPanel" class="auth-panel" hidden>
        <p id="setupHint" class="setup-hint" hidden>First run — create a login to get started.</p>
        <input id="username" autocomplete="username" placeholder="Username">
        <input id="password" autocomplete="current-password" placeholder="Password" type="password">
        <button id="login" type="button">Login</button>
      </div>
      <div id="namePanel" class="name-panel" hidden>
        <p class="name-hint">What should we call you in chat?</p>
        <input id="displayNameInput" autocomplete="name" placeholder="Your name" maxlength="80">
        <button id="saveDisplayName" type="button">Save</button>
        <span id="nameStatus" class="auth-status" hidden></span>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="fixed-composer">
        <div class="composer-main">
          <div id="attachChips" class="attach-chips" hidden></div>
          <div class="composer-row">
            <label class="attach-btn btn-secondary" title="Attach files">
              📎
              <input id="attachInput" type="file" multiple hidden>
            </label>
            <select id="attachRecipient" class="attach-recipient" title="Who receives attachments" hidden>
              <option value="hub">This chat (Hub)</option>
              <option value="company">Company / KS</option>
            </select>
            <textarea id="messageInput" rows="2" placeholder="Message the hub"></textarea>
            <button type="submit">Send</button>
          </div>
        </div>
      </form>
    </section>

  </main>

  <div id="configModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">LLM &amp; model</h3>
        <button id="modalClose" type="button" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <label for="modalCliSelect">LLM</label>
        <select id="modalCliSelect"></select>
        <label for="modalModelSelect">Model</label>
        <select id="modalModelSelect"></select>
        <input id="modalModelCustom" type="text" placeholder="Custom model id (e.g. gpt-5.4)"
               hidden autocomplete="off" spellcheck="false">
        <p id="modalStatus" class="modal-status auth-status" hidden></p>
      </div>
      <div class="modal-footer">
        <button id="modalCancel" type="button" class="btn-secondary">Cancel</button>
        <button id="modalSave" type="button">Save</button>
      </div>
    </div>
  </div>

  <div id="companyModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="companyModalTitle">
    <div class="modal-content modal-content--wide">
      <div class="modal-header">
        <h3 id="companyModalTitle">Company files</h3>
        <button id="companyModalClose" type="button" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="company-help">
          Upload docs into <code>company/</code> on the hub for the weekly Knowledge Stack.
          Use this when you cannot reach the hub filesystem (remote server / VPN).
        </p>
        <div class="company-upload-row">
          <label for="companySubdir">Folder</label>
          <select id="companySubdir">
            <option value="">company/ (root)</option>
            <option value="news">company/news/</option>
            <option value="incidents">company/incidents/</option>
            <option value="uploads">company/uploads/</option>
          </select>
          <label class="company-file-label btn-secondary">
            Choose file
            <input id="companyFileInput" type="file" hidden>
          </label>
          <label class="company-overwrite">
            <input id="companyOverwrite" type="checkbox"> Overwrite if exists
          </label>
        </div>
        <p id="companyStatus" class="modal-status auth-status" hidden></p>
        <div class="company-list-head">Files on hub</div>
        <ul id="companyFileList" class="company-file-list"></ul>
      </div>
      <div class="modal-footer">
        <button id="companyRefresh" type="button" class="btn-secondary">Refresh</button>
        <button id="companyModalDone" type="button">Done</button>
      </div>
    </div>
  </div>

  <script src="/enterprise/enterprise-panel.js" onerror="/* enterprise optional */"></script>
  <script src="/markdown.js?v=20260903-tts-md-fence"></script>
  <script src="/app.js?v=20260904-model-picker"></script>
</body>
</html>
