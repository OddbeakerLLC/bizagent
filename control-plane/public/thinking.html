<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizAgent Thinking</title>
  <link rel="stylesheet" href="/styles.css?v=20261001-thinking">
</head>
<body class="thinking-page">
  <main class="thinking-app" id="thinkingApp">
    <header class="topbar thinking-topbar">
      <div class="thinking-topbar-left">
        <h1 class="thinking-page-title">Thinking...</h1>
        <span id="thinkingAuthLabel" class="auth-status">Checking session…</span>
      </div>
      <div class="auth-controls">
        <a class="btn-secondary thinking-console-link" href="/">Console</a>
      </div>
    </header>

    <div id="thinkingAuthGate" class="thinking-auth-gate" hidden>
      <p class="company-help">Sign in on the main BizAgent console, then reopen Thinking.</p>
      <p><a href="/">Open console</a></p>
    </div>

    <div class="thinking-page-body" id="thinkingMain">
      <div id="thinkingFilters" class="thinking-filters" role="toolbar" aria-label="Filter agents"></div>
      <p id="thinkingStatus" class="thinking-status" hidden></p>
      <pre id="thinkingPane" class="thinking-pane" aria-live="polite"></pre>
    </div>
  </main>
  <script src="/thinking-view.js?v=20261001-thinking"></script>
</body>
</html>
